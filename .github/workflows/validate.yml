name: QuickFix validation

on:
  push:
    branches: [arena/01a07d14-quick-fix, arena/f4c30e79-quick-fix]
    paths:
      - mobile/**
      - admin/**
      - backend/translation-proxy/**
      - backend/seed/**
      - docs/firestore/**
      - firebase.validation.json
      - validation/**
      - .github/workflows/validate.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read
  checks: write

defaults:
  run:
    shell: bash

concurrency:
  group: quickfix-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: false
      - name: Record toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/quickfix-mobile"
          flutter config --no-analytics
          flutter --version | tee "$RUNNER_TEMP/quickfix-mobile/toolchain.log"
      - name: Resolve existing mobile dependencies
        id: packages
        working-directory: mobile
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/quickfix-mobile/packages.log"
      - name: Analyze
        id: analyze
        continue-on-error: true
        working-directory: mobile
        run: flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/quickfix-mobile/analyze.log"
      - name: Test with coverage
        id: tests
        continue-on-error: true
        working-directory: mobile
        run: timeout 900s flutter test --no-pub --coverage --concurrency 2 --timeout 30s --machine 2>&1 | tee "$RUNNER_TEMP/quickfix-mobile/tests.log"
      - name: Publish diagnostics check (no production credentials)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_KIND: mobile
          VALIDATION_DIR: ${{ runner.temp }}/quickfix-mobile
          VALIDATION_PACKAGES: ${{ steps.packages.outcome }}
          VALIDATION_ANALYZE: ${{ steps.analyze.outcome }}
          VALIDATION_TESTS: ${{ steps.tests.outcome }}
        run: node .github/scripts/publish-validation.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-validation
          path: |
            ${{ runner.temp }}/quickfix-mobile
            mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce results
        if: always()
        env:
          PACKAGES: ${{ steps.packages.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: test "$PACKAGES" = success && test "$ANALYZE" = success && test "$TESTS" = success

  rules:
    name: Firestore Rules emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install development-only emulator test dependencies
        id: packages
        working-directory: validation/firestore
        run: |
          mkdir -p "$RUNNER_TEMP/quickfix-rules"
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/quickfix-rules/packages.log"
      - name: Run only local demo-project Rules tests
        id: tests
        continue-on-error: true
        working-directory: validation/firestore
        env:
          CI: 'true'
          FIREBASE_CLI_DISABLE_AUTO_UPDATE: 'true'
        run: npm test 2>&1 | tee "$RUNNER_TEMP/quickfix-rules/tests.log"
      - name: Publish Rules diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_KIND: rules
          VALIDATION_DIR: ${{ runner.temp }}/quickfix-rules
          VALIDATION_PACKAGES: ${{ steps.packages.outcome }}
          VALIDATION_TESTS: ${{ steps.tests.outcome }}
        run: node .github/scripts/publish-validation.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rules-validation
          path: |
            ${{ runner.temp }}/quickfix-rules
            validation/firestore/*debug.log
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Rules results
        if: always()
        env:
          PACKAGES: ${{ steps.packages.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: test "$PACKAGES" = success && test "$TESTS" = success

  backend:
    name: ML proxy contracts and seed dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install existing proxy dependencies only
        id: packages
        run: |
          mkdir -p "$RUNNER_TEMP/quickfix-backend"
          npm ci --prefix backend/translation-proxy --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/quickfix-backend/packages.log"
      - name: Test injected ML provider contracts and pure seed generator
        id: tests
        continue-on-error: true
        run: |
          npm test --prefix backend/translation-proxy 2>&1 | tee "$RUNNER_TEMP/quickfix-backend/tests.log"
          node --test backend/seed/test/*.test.js 2>&1 | tee -a "$RUNNER_TEMP/quickfix-backend/tests.log"
          node backend/seed/seed.js --dry-run 2>&1 | tee "$RUNNER_TEMP/quickfix-backend/dry-run.log"
      - name: Publish backend diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_KIND: backend
          VALIDATION_DIR: ${{ runner.temp }}/quickfix-backend
          VALIDATION_PACKAGES: ${{ steps.packages.outcome }}
          VALIDATION_TESTS: ${{ steps.tests.outcome }}
        run: node .github/scripts/publish-validation.mjs
      - name: Enforce backend results
        if: always()
        env:
          PACKAGES: ${{ steps.packages.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: test "$PACKAGES" = success && test "$TESTS" = success

  admin:
    name: Admin types, lint and build (not browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install existing admin dependencies
        id: packages
        run: |
          mkdir -p "$RUNNER_TEMP/quickfix-admin"
          npm ci --prefix admin --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/quickfix-admin/packages.log"
      - name: Check TypeScript and lint
        id: analyze
        continue-on-error: true
        working-directory: admin
        run: (npx tsc -b --force && npm run lint) 2>&1 | tee "$RUNNER_TEMP/quickfix-admin/analyze.log"
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build --prefix admin 2>&1 | tee "$RUNNER_TEMP/quickfix-admin/tests.log"
      - name: Publish admin diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_KIND: admin
          VALIDATION_DIR: ${{ runner.temp }}/quickfix-admin
          VALIDATION_PACKAGES: ${{ steps.packages.outcome }}
          VALIDATION_ANALYZE: ${{ steps.analyze.outcome }}
          VALIDATION_BUILD: ${{ steps.build.outcome }}
        run: node .github/scripts/publish-validation.mjs
      - name: Enforce admin checks
        if: always()
        env:
          PACKAGES: ${{ steps.packages.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: test "$PACKAGES" = success && test "$ANALYZE" = success && test "$BUILD" = success
